app:
  security:
    # Looks for an environment variable named JWT_SECRET.
    jwt-secret: ${JWT_SECRET}
    # Looks for JWT_EXPIRATION, defaults to 86400000 (24h) if not found.
    jwt-expiration: ${JWT_EXPIRATION:86400000}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@ikhefuhr.com}
    admin-password: ${SEED_ADMIN_PASSWORD}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ikhefuhr}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect